name: Import pinned Firestorm source (review PR)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/rebrand_firestorm.py'
      - '.github/workflows/import-firestorm.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: import-firestorm-source
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out foundation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch verified release source and create review branch
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM="https://github.com/FirestormViewer/phoenix-firestorm.git"
          PIN="10bd3c9f930c76e1427ddd4ecece6cdf36b4406d"
          BRANCH="feature/firestorm-source-import"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git ls-remote --exit-code --heads origin "$BRANCH" > /tmp/existing-branch || true
          if [[ -s /tmp/existing-branch ]]; then
            echo "Review branch already exists; refusing to overwrite it."
            exit 1
          fi
          git remote add firestorm "$UPSTREAM"
          git fetch --no-tags firestorm refs/heads/Firestorm_7.2.4:refs/remotes/firestorm/Firestorm_7.2.4
          ACTUAL="$(git rev-parse refs/remotes/firestorm/Firestorm_7.2.4^{commit})"
          if [[ "$ACTUAL" != "$PIN" ]]; then
            echo "Pinned source changed: expected $PIN, observed $ACTUAL"
            exit 1
          fi
          git switch -c "$BRANCH"
          # Source-tree conflicts are resolved in favor of the existing foundation;
          # every conflict and license must still be reviewed in the PR before merge.
          if ! git merge --allow-unrelated-histories --no-ff --no-commit -X ours \
            -m "import: pinned Firestorm 7.2.4 release source (review required)" "$PIN"; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if [[ "${#conflicts[@]}" -eq 0 ]]; then
              echo "Merge exited nonzero without identifiable unresolved paths."
              exit 1
            fi
            for path in "${conflicts[@]}"; do
              case "$path" in
                LICENSE)
                  # Foundation LICENSE is the same LGPL-2.1 basis as upstream.
                  # Never rewrite original source file copyright notices.
                  git checkout --ours -- LICENSE
                  git add LICENSE
                  ;;
                .gitignore)
                  # Preserve local excludes AND add upstream build excludes.
                  git show :2:.gitignore > .gitignore
                  while IFS= read -r line || [[ -n "$line" ]]; do
                    [[ -z "$line" || "$line" == \#* ]] && continue
                    if ! grep -Fxq -- "$line" .gitignore; then
                      printf '%s\n' "$line" >> .gitignore
                    fi
                  done < <(git show :3:.gitignore)
                  git add .gitignore
                  ;;
                *)
                  echo "Unexpected merge conflict: $path; manual audit required."
                  exit 1
                  ;;
              esac
            done
            if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
              echo "Unresolved conflicts remain."
              exit 1
            fi
          fi

          # Do not import upstream GitHub Actions workflows. GitHub's default
          # GITHUB_TOKEN may push source files but cannot modify workflow files
          # without the dedicated workflows permission. Their CI is also
          # upstream-specific and must not execute in TrixieStorm.
          # Keep the two reviewed TrixieStorm workflows already on main.
          while IFS= read -r -d '' path; do
            case "$path" in
              .github/workflows/foundation.yml|.github/workflows/import-firestorm.yml)
                ;;
              .github/workflows/*)
                echo "Omitting upstream workflow/config: $path"
                git rm --force -- "$path"
                ;;
            esac
          done < <(git ls-files -z -- .github/workflows)

          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo "Unresolved conflicts remain; refusing to publish."
            exit 1
          fi
          git commit -m "import: pinned Firestorm 7.2.4 release source (review required)"
          git merge-base --is-ancestor "$PIN" HEAD || {
            echo "Upstream provenance was not retained in the merge commit."
            exit 1
          }
          test -f indra/CMakeLists.txt || {
            echo "Unexpected source layout after merge; do not publish this branch."
            exit 1
          }
          # Replace product branding after the pinned release has been merged.
          # Do not rewrite copyright/third-party notices or internal FS symbols.
          python3 scripts/rebrand_firestorm.py
          python3 scripts/rebrand_firestorm.py --check
          git diff --check
          git add indra
          git commit -m "brand: rename application to TrixieStorm Viewer" || {
            echo "Expected product rename produced no changes."
            exit 1
          }
          git push origin "$BRANCH"

      - name: Create review pull request (never merge automatically)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr create \
            --base main \
            --head feature/firestorm-source-import \
            --title "Import and rebrand Firestorm 7.2.4 as TrixieStorm Viewer" \
            --body "Imports the pinned official Firestorm_7.2.4 source at 10bd3c9f930c76e1427ddd4ecece6cdf36b4406d, then applies the scripted TrixieStorm product rename for Win/Linux. **Not a compiled viewer.** Review all upstream copyright/license and binary dependency notices, source-tree conflict resolution, build requirements and NexVerse-only Gen1/Gen2 policy before merging. No auto-merge. See docs/LEGAL.md and docs/GRID_POLICY.md."
