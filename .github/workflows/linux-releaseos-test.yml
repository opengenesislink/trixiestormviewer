name: Linux x86_64 ReleaseOS test viewer

on:
  push:
    branches: [feature/firestorm-source-import]
    paths:
      - '.github/workflows/linux-releaseos-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trixiestorm-linux-releaseos
  cancel-in-progress: false

jobs:
  linux-releaseos:
    name: Compile and package TrixieStorm ReleaseOS on Ubuntu 22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    env:
      DEBIAN_FRONTEND: noninteractive
      CC: gcc-11
      CXX: g++-11
      XZ_DEFAULTS: '-T2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Free disk space for C++ viewer third-party packages
        shell: bash
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/local/share/powershell
          sudo apt-get clean
          df -h /
          free -h

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Linux viewer build prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             build-essential gcc-11 g++-11 cmake ninja-build git             python3-pip python3-venv libgl1-mesa-dev libglu1-mesa-dev             libpulse-dev libssl-dev libxinerama-dev libxrandr-dev             libfontconfig-dev libfreetype6-dev libasound2-dev             libx11-dev libxi-dev libxcursor-dev libxext-dev libxrender-dev             libatk1.0-dev libdbus-1-dev libgtk-3-dev             libopenal-dev libxss-dev zstd xz-utils unzip curl pkg-config
          gcc --version
          g++-11 --version
          cmake --version
          ninja --version
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install official Linden Autobuild dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          autobuild --version

      - name: Load upstream Firestorm build variables
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/FirestormViewer/fs-build-variables.git ../fs-build-variables
          test -s ../fs-build-variables/variables
          echo "AUTOBUILD_VARIABLES_FILE=$GITHUB_WORKSPACE/../fs-build-variables/variables" >> "$GITHUB_ENV"
          echo "Using upstream compiler variables for C++20 / Linux x86_64"

      - name: Run source policy and XML checks first
        run: |
          python3 scripts/audit_branding.py
          python3 scripts/audit_nexverse_runtime.py
          python3 scripts/audit_nexverse_clock.py

      - name: Fetch and configure complete ReleaseOS dependencies
        shell: bash
        run: |
          set -o pipefail
          autobuild configure -A 64 -c ReleaseOS -- -DPACKAGE:BOOL=ON -DLL_TESTS:BOOL=OFF             2>&1 | tee /tmp/trixiestorm-configure.log
          df -h /
          find build-linux-x86_64 -maxdepth 2 -name CMakeCache.txt -print

      - name: Compile actual OpenSimulator viewer and package it
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-linux-x86_64 --parallel 2             2>&1 | tee /tmp/trixiestorm-build.log
          df -h /

      - name: Validate produced Linux viewer tarball
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          find build-linux-x86_64/newview -maxdepth 3 -type f ( -name '*.tar.xz' -o -name '*.tar.bz2' -o -name '*.tar.gz' ) -print
          archive="$(find build-linux-x86_64/newview -maxdepth 3 -type f ( -name '*.tar.xz' -o -name '*.tar.bz2' -o -name '*.tar.gz' ) | head -n 1)"
          test -n "$archive"
          tar -tf "$archive" | head -n 25 || test "$?" -eq 141
          cp "$archive" out/
          sha256sum out/* | tee out/SHA256SUMS.txt
          printf 'Source Git SHA: %s\nTarget: Ubuntu 22.04 x86_64 ReleaseOS\n' "$GITHUB_SHA" > out/BUILD-INFO.txt

      - name: Upload compiled Linux test viewer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TrixieStorm-Linux-x86_64-ReleaseOS-Test
          path: out/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload configure/build diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TrixieStorm-Linux-ReleaseOS-build-logs
          path: |
            /tmp/trixiestorm-configure.log
            /tmp/trixiestorm-build.log
          if-no-files-found: ignore
          retention-days: 7
